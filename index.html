<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a saved theme before first paint to avoid a flash of the wrong one.
      try {
        const theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {
        // Storage unavailable: follow the system theme.
      }
    </script>
    <!--
      English defaults for crawlers and link previews, which don't run JavaScript.
      Keep in sync with name, role and intro in src/data/profile.ts; the app updates
      the title and description to the visitor's language at runtime.
    -->
    <title>Miguel Andreu · Databricks Solutions Architect / Forward Deployed Engineer</title>
    <meta name="description" content="Data architect and tech lead with 8 years of experience designing scalable data platforms on Databricks, Azure and GCP for the pharmaceutical, retail, automotive and chemical sectors. Master's in Big Data and Data Science (Universidad Autónoma de Madrid) and Postgraduate Diploma in Project Management (Universitat Oberta de Catalunya)." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Miguel Andreu · Databricks Solutions Architect / Forward Deployed Engineer" />
    <meta property="og:description" content="Data architect and tech lead with 8 years of experience designing scalable data platforms on Databricks, Azure and GCP for the pharmaceutical, retail, automotive and chemical sectors. Master's in Big Data and Data Science (Universidad Autónoma de Madrid) and Postgraduate Diploma in Project Management (Universitat Oberta de Catalunya)." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
